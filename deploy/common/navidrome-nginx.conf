server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location @oauth2_sign_in {
        return 302 /oauth2/start?rd=$request_uri;
    }

    location ^~ /share/ {
        proxy_pass http://127.0.0.1:4533;
    }

    location ^~ /rest/ {
        proxy_pass http://127.0.0.1:4533;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:4533/favicon.ico;
    }

    location = /app/manifest.webmanifest {
        proxy_pass http://127.0.0.1:4533/app/manifest.webmanifest;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;

        auth_request_set $user $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Email $email;
        proxy_pass http://127.0.0.1:4533;
    }
}

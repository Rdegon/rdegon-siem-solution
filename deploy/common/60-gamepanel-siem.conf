# Forward game-panel application telemetry without duplicating host auth/audit.
# Native host messages use 90-siem-forward.conf; audit.log uses
# 91-siem-audit-imfile.conf.
template(
    name="GamePanelSIEM"
    type="string"
    string="<%PRI%>1 %timestamp:::date-rfc3339% %hostname% %programname% - - [observer.name=\"gamepanel-01\" observer.ip=\"10.20.20.130\" source.family=\"game-server\" collector.profile=\"app\"] %msg%\n"
)

ruleset(name="gamepanel_app_forward") {
    action(
        type="omfwd"
        target="10.20.10.104"
        port="1518"
        protocol="tcp"
        template="GamePanelSIEM"
        action.resumeRetryCount="-1"
        queue.type="linkedList"
        queue.filename="gamepanel-app-fwd"
    )
}

input(type="imfile" File="/var/www/pterodactyl/storage/logs/laravel*.log" Tag="pterodactyl-panel" Severity="info" Facility="local6" Ruleset="gamepanel_app_forward")
input(type="imfile" File="/var/log/pterodactyl/wings.log" Tag="pterodactyl-wings" Severity="info" Facility="local6" Ruleset="gamepanel_app_forward")
input(type="imfile" File="/var/log/nginx/pterodactyl.access.log" Tag="gamepanel-nginx-access" Severity="info" Facility="local6" Ruleset="gamepanel_app_forward")
input(type="imfile" File="/var/log/nginx/pterodactyl.error.log" Tag="gamepanel-nginx-error" Severity="warning" Facility="local6" Ruleset="gamepanel_app_forward")
input(type="imfile" File="/var/lib/pterodactyl/volumes/*/logs/*.log" Tag="game-server-log" Severity="info" Facility="local6" Ruleset="gamepanel_app_forward")
input(type="imfile" File="/var/lib/docker/containers/*/*.log" Tag="gamepanel-docker-json" Severity="info" Facility="local6" Ruleset="gamepanel_app_forward")

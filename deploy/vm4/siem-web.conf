server {
    listen 80;
    server_name 10.20.10.107 192.168.3.102;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 10.20.10.107 192.168.3.102;

    ssl_certificate /etc/siem/tls/web.crt;
    ssl_certificate_key /etc/siem/tls/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        image/svg+xml;

    location /app/assets/ {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/assets/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/favicon.ico;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location = /favicon.svg {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/favicon.svg;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location = /mark.svg {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/mark.svg;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location = /app/favicon.ico {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/favicon.ico;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location = /app/favicon.svg {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/favicon.svg;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location = /app/mark.svg {
        alias /opt/siem/siem-solution/services/web/frontend-react/dist/mark.svg;
        access_log off;
        expires 15m;
        add_header Cache-Control "public, max-age=900";
    }

    location /realms/ {
        proxy_pass http://127.0.0.1:8081/realms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /resources/ {
        proxy_pass http://127.0.0.1:8081/resources/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8081/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /js/ {
        proxy_pass http://127.0.0.1:8081/js/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}

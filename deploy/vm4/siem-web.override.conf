[Unit]
After=siem-vault.service siem-keycloak.service
Requires=siem-vault.service siem-keycloak.service

[Service]
Environment=PYTHONPATH=/opt/siem/siem-solution/services/web:/opt/siem/siem-solution/services/web/app:/opt/siem/siem-solution
ExecStart=
ExecStart=/opt/siem/venv-web/bin/python -m uvicorn main:app --app-dir /opt/siem/siem-solution/services/web --host 127.0.0.1 --port 8000 --workers 4 --timeout-keep-alive 30

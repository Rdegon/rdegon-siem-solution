map $http_upgrade $security_console_connection {
    default upgrade;
    '' close;
}

server {
    listen 8444 ssl;
    server_name 192.168.3.102;

    ssl_certificate /etc/siem/tls/web.crt;
    ssl_certificate_key /etc/siem/tls/web.key;

    client_max_body_size 2g;
    location / {
        proxy_pass https://10.20.10.131;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $security_console_connection;
        proxy_read_timeout 300s;
        proxy_redirect https://10.20.10.131/ https://192.168.3.102:8444/;
    }
}

server {
    listen 8889 ssl;
    server_name 192.168.3.102;

    ssl_certificate /etc/siem/tls/web.crt;
